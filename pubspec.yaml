name: sinapsis
description: "Sinapsis — gestor de conocimiento multi-fuente: captura, transforma y relaciona todo lo que leés, mirás y escuchás."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  # Un .docx y un .epub son, los dos, un ZIP con XML adentro. Con esto y
  # `xml` se leen sin depender de un paquete dedicado: ver la decisión 3 en
  # docs/arquitectura.md.
  #
  # Tope en <4.1.0 porque `pdf` (exportación) todavía no soporta 4.1 en
  # adelante. Entre 4.0.9 y 4.2.0 no hay ningún cambio que afecte lo que usa
  # este proyecto — solo arreglos y agregados, según el changelog del
  # paquete— así que no cuesta nada real quedarse en 4.0.9 hasta que `pdf`
  # levante el tope.
  archive: ">=4.0.9 <4.1.0"
  # Convierte cualquier audio —o la pista de audio de un video— a WAV en
  # crudo, con las APIs nativas de cada sistema operativo y sin FFmpeg: la
  # opción de siempre para esto, `ffmpeg_kit_flutter`, se dejó de mantener a
  # mediados de 2025 y no le confiaría a un paquete abandonado la conversión
  # que hace falta antes de transcribir. MIT.
  audio_decoder: ^0.8.1
  # PBKDF2-HMAC-SHA256 para derivar el hash del PIN de la bóveda. Se usa un
  # paquete mantenido en vez de implementar el KDF a mano: escribir
  # criptografía propia es una mala idea aunque el algoritmo sea simple.
  cryptography: ^2.9.0
  # Soltar un archivo sobre la ventana de la app. Licencia Apache-2.0. Cubre
  # Windows, macOS y Linux para cuando existan, y también web —la única
  # plataforma de escritorio que ya está armada en este proyecto—, todo con
  # el mismo widget.
  desktop_drop: ^0.8.4
  dio: ^5.7.0
  # Base de datos local. `drift_flutter` resuelve por sí solo las librerías
  # nativas de SQLite y la ruta del archivo en cada plataforma; no hace falta
  # agregar `sqlite3_flutter_libs` a mano (de hecho ya está deprecado a favor
  # de `sqlite3` 3.x, que drift_flutter arrastra).
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  file_picker: ^11.0.3
  flutter:
    sdk: flutter
  # Un modelo de lenguaje corriendo en el dispositivo, para la respuesta en
  # lenguaje natural del chat sobre la bóveda. El único paquete con soporte
  # de verdad en Android y Windows a la vez con un único formato de modelo
  # (LiteRT-LM); en escritorio corre por FFI directo, sin JVM ni servidor
  # aparte. Ver la decisión 20 en docs/arquitectura.md.
  flutter_gemma: ^1.8.2
  # El motor de escritorio de flutter_gemma: en Windows, macOS y Linux solo
  # entiende el formato `.litertlm`, y ese soporte vive en este paquete
  # aparte, no en flutter_gemma a secas.
  flutter_gemma_litertlm: ^1.6.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  flutter_tts: ^4.2.5
  fpdart: ^1.1.1
  freezed_annotation: ^3.1.0
  go_router: ^14.6.2
  # OCR en el dispositivo, sin clave ni cuota: el texto de una imagen. MIT.
  # Solo Android e iOS —ML Kit no tiene versión web ni de escritorio—, y solo
  # el reconocedor de script latino: cubre español e inglés, los dos idiomas
  # de la interfaz, sin sumar los paquetes de otros alfabetos.
  google_mlkit_text_recognition: ^0.17.1
  # Parseo de HTML, para la extracción de artículos.
  html: ^0.15.7
  # HTML -> Markdown: el formato de intercambio del proyecto.
  html2md: ^1.3.2
  # Ya venía como dependencia transitiva; se declara explícita porque ahora
  # el código del proyecto la usa directamente: codifica a PNG los píxeles
  # BGRA crudos que devuelve `pdfrx_engine` al renderizar una página de PDF,
  # para poder pasarla por el mismo `ImageTextExtractor` que ya usa
  # `ImageTransformer` (ver `PdfParser`, que le pide OCR a una página sin
  # texto en vez de darla por perdida).
  image: ^4.9.2
  # Abrir la cámara para sacarle una foto a algo —un cartel, una pizarra, la
  # página de un libro sin escanear— y guardarla igual que cualquier otro
  # archivo elegido a mano. BSD-3-Clause y del propio equipo de Flutter,
  # igual que `video_player` y `webview_flutter`: el mismo criterio de
  # siempre, nada que dependa de que un tercero lo siga manteniendo.
  # `ImageSource.camera` —a diferencia de elegir de la galería— solo está
  # implementado de verdad en Android, iOS y web; en Windows, macOS y Linux
  # no hay ninguna cámara detrás del selector, así que la tarjeta de cámara
  # en la captura se oculta fuera de esas tres plataformas en vez de ofrecer
  # un botón que reviente al tocarlo.
  image_picker: ^1.1.2
  intl: ^0.20.2
  json_annotation: ^4.12.0
  logger: ^2.5.0
  meta: ^1.16.0
  # Abrir el archivo original con la app que el sistema tenga asociada a su
  # tipo (el lector de PDF, el procesador de textos). Licencia BSD-3-Clause,
  # y el único candidato con soporte parejo en los seis destinos del
  # proyecto — Android, iOS, Windows, macOS, Linux y web.
  open_app_file: ^4.0.5
  # Para guardar los archivos pesados (PDFs, audio, imágenes, copias de
  # páginas) fuera de la base: SQLite se vuelve lento si se le meten binarios
  # grandes, y casi ninguna consulta los necesita.
  path: ^1.9.0
  path_provider: ^2.1.6
  # Generación de PDF en Dart puro, con licencia Apache-2.0. Se usa solo para
  # *escribir* el PDF de exportación: la lectura (extraer texto de un PDF ya
  # existente, fase 5) sigue con `pdfrx_engine`, que es un lector, no un
  # generador.
  #
  # Tope en <3.13.0: desde esa versión `pdf` pide `xml` 7, que choca con el
  # `xml` 6 que todavía pide `youtube_explode_dart` (no publicó una versión
  # nueva que se lleve bien con xml 7). 3.12.0 es la última que todavía pide
  # `xml` 6, así que no hace falta renunciar a nada mientras tanto.
  pdf: ">=3.12.0 <3.13.0"
  # Port en Dart del algoritmo Readability de Mozilla. Se probó contra HTML
  # realista antes de confiarle la extracción (ver docs/arquitectura.md).
  # PDFium de Chromium empaquetado para cada plataforma. Es el complemento
  # que trae el binario nativo, lo usan tanto `pdfrx_engine` (extraer texto)
  # como `pdfrx` (mostrar las páginas).
  pdfium_flutter: ^0.3.0
  # El visor completo, con paginado y zoom con pellizco — el complemento
  # de `pdfrx_engine`. Antes se evitaba a propósito porque solo hacía falta
  # extraer texto (ver la decisión 3 en docs/arquitectura.md); ahora que la
  # app también necesita *mostrar* el PDF como se ve fuera de ella, el
  # costo de sumar `url_launcher` de paso deja de pesar más que construir
  # un visor de páginas a mano.
  pdfrx: ^2.6.1
  # La API de lectura de PDF sobre PDFium, en Dart puro y con licencia MIT.
  # Reemplaza a syncfusion_flutter_pdf, cuya licencia community es
  # propietaria: ver la decisión 3 en docs/arquitectura.md. Sigue siendo lo
  # que usa `PdfParser` para extraer texto; `pdfrx` (arriba) es solo para
  # mostrar las páginas.
  pdfrx_engine: ^0.6.0
  reader_mode: ^0.2.3
  # Recibir contenido compartido desde otras apps (el botón de compartir del
  # teléfono). Licencia Apache-2.0. Solo se configura el lado Android: el de
  # iOS necesita además una Share Extension —un target nuevo de Xcode, con su
  # propio Info.plist y un App Group para pasarle los datos a la app
  # principal— que no se puede armar a ciegas sin Xcode ni compilar sin una
  # Mac, y este proyecto no tiene ninguna de las dos cosas. Ver la decisión 7
  # en docs/arquitectura.md.
  receive_sharing_intent: ^1.9.0
  # Escribir el paquete de NotebookLM en Android exige el Storage Access
  # Framework de verdad, no una ruta de archivo adivinada a partir del URI
  # que devuelve `file_picker` —eso funciona por coincidencia en carpetas
  # comunes como Download o Documents, y falla en las que Android reserva a
  # una colección de medios (Alarms, Ringtones, Notifications, Podcasts,
  # Music), donde el almacenamiento con ámbito bloquea la escritura directa
  # aunque el permiso del árbol SAF ya se haya otorgado. `saf_util` elige la
  # carpeta y `saf_stream` escribe ahí por el URI real, sin adivinar nada.
  # Los dos, BSD-3-Clause, del mismo autor y pensados para usarse juntos.
  #
  # Fijado en 4.0.0, no ^4.0.1: esa versión sube su dependencia de `jni` a
  # ^1.0.2, que choca con la que trae `sentry_flutter` (jni 0.14.2, fijada
  # por ese paquete). 4.0.0 pide `jni` ^0.14.1, compatible con las dos cosas
  # a la vez.
  saf_stream: 4.0.0
  saf_util: ^3.1.0
  sentry_flutter: ^9.29.0
  shared_preferences: ^2.3.3
  # Whisper corriendo en el dispositivo, sin clave ni cuota. Apache-2.0, y el
  # único motor con soporte parejo en los seis destinos del proyecto —
  # Android, iOS, Windows, macOS, Linux y web—, igual que open_app_file. El
  # modelo en sí no viene con el paquete: se elige y se descarga aparte, ver
  # la decisión 8 en docs/arquitectura.md.
  sherpa_onnx: ^1.13.8
  # UUID v7 para los identificadores: a diferencia del v4, son ordenables por
  # tiempo, lo que mantiene los índices compactos en vez de dispersar cada
  # inserción por todo el árbol.
  uuid: ^4.6.0
  # Ya venía como dependencia transitiva de Flutter; se declara explícita
  # porque el grafo de relaciones la usa directamente para encuadrar la
  # vista (`Matrix4`), en vez de reimplementar álgebra de matrices propia
  # para una sola transformación.
  vector_math: ^2.4.0
  # El reproductor de audio y video integrado, sobre el motor nativo de
  # cada plataforma (ExoPlayer en Android). BSD-3-Clause y mantenido por el
  # propio equipo de Flutter — el mismo criterio de siempre: nada que
  # dependa de que un tercero lo siga manteniendo.
  video_player: ^2.14.0
  # Ya venía como dependencia transitiva; se declara explícita porque ahora
  # el código del proyecto la usa directamente: es el interop con OPFS de
  # OpfsFileStore, ver la decisión 9 en docs/arquitectura.md.
  web: ^1.1.1
  # El visor de páginas archivadas: muestra el HTML completo tal como quedó
  # guardado —con sus imágenes y sus estilos incrustados—, en vez de la
  # versión en Markdown que ya se ve en el detalle. Igual que `video_player`,
  # es del propio equipo de Flutter y corre sobre el motor nativo de cada
  # plataforma (`WebView` en Android), así que no hay un tercero de quien
  # depender para que siga funcionando.
  webview_flutter: ^4.10.0
  # Ya venía como dependencia transitiva; se declara explícita porque ahora
  # el código del proyecto la usa directamente para leer el OPF de un EPUB y
  # el document.xml de un DOCX.
  xml: ^6.6.1
  # Metadatos y subtítulos de YouTube sin API key ni cuotas.
  youtube_explode_dart: ^3.1.0

dev_dependencies:
  # Para `StreamQueue` en los tests de streams: permite pedir la siguiente
  # emisión de a una, que es lo que hace deterministas las pruebas de `watch`.
  async: ^2.11.0
  build_runner: ^2.4.13
  drift_dev: ^2.35.0
  flutter_secure_storage_platform_interface: ^1.1.2
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  json_serializable: ^6.9.0
  mocktail: ^1.0.4
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true
  generate: true

  # Inter, empaquetada con la app en vez de bajada en tiempo de ejecución
  # (ver la decisión 12 en docs/arquitectura.md y tool/fetch_inter_font.sh).
  # Un solo archivo variable cubre los dos pesos que usa la escala
  # tipográfica por defecto de Material 3: Flutter elige la instancia
  # correcta de "Inter[wght]" según el `weight` de cada entrada.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
          weight: 400
        - asset: assets/fonts/InterVariable.ttf
          weight: 500
