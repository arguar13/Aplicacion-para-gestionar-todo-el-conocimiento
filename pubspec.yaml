name: sinapsis
description: "Sinapsis — gestor de conocimiento multi-fuente: captura, transforma y relaciona todo lo que leés, mirás y escuchás."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  dio: ^5.7.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  fpdart: ^1.1.1
  freezed_annotation: ^3.1.0
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  intl: ^0.20.2
  json_annotation: ^4.12.0
  logger: ^2.5.0
  meta: ^1.16.0
  sentry_flutter: ^8.14.0
  shared_preferences: ^2.3.3

dev_dependencies:
  build_runner: ^2.4.13
  flutter_secure_storage_platform_interface: ^1.1.2
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  json_serializable: ^6.9.0
  mocktail: ^1.0.4
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true
  generate: true
