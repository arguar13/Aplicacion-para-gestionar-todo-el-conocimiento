include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.freezed.dart"
    - "**/*.g.dart"
    - "build/**"
    - android/**
    - ios/**
    - web/**
    - windows/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Los archivos generados no siguen nuestras reglas; no deben romper el build.
    todo: ignore

linter:
  rules:
    # very_good_analysis exige doc comments en todo miembro público. El equipo
    # prefiere nombres autoexplicativos y comentarios solo cuando el "por qué"
    # no es obvio, así que esta regla se desactiva explícitamente.
    public_member_api_docs: false
