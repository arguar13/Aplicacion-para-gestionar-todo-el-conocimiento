include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.freezed.dart"
    - "**/*.g.dart"
    # Los snapshots de esquema de `drift_dev schema generate`: se llaman
    # `schema_vN.dart`, sin sufijo `.g.dart`, así que el patrón de arriba no
    # los alcanza. Cambian de estilo según la versión de drift_dev que los
    # generó —no algo que valga la pena mantener a mano—.
    - "test/generated_migrations/**"
    - "build/**"
    - android/**
    - ios/**
    - web/**
    - windows/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Los archivos generados no siguen nuestras reglas; no deben romper el build.
    todo: ignore

linter:
  rules:
    # very_good_analysis exige doc comments en todo miembro público. El equipo
    # prefiere nombres autoexplicativos y comentarios solo cuando el "por qué"
    # no es obvio, así que esta regla se desactiva explícitamente.
    public_member_api_docs: false
