name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop

# Si se empuja un nuevo commit a un PR mientras el run anterior sigue
# corriendo, cancela el viejo — evita gastar minutos de Actions en un
# resultado que ya quedó obsoleto.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze, format & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cachea los paquetes de pub.dev (no el SDK de Flutter, eso lo
      # cachea flutter-action con `cache: true` más abajo). Se invalida
      # solo cuando cambia pubspec.lock.
      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Obligatorio en este repo: *.freezed.dart / *.g.dart están en
      # .gitignore (no se versiona código generado), así que sin este
      # paso `flutter analyze` y `flutter test` fallan de entrada al no
      # poder resolver los `part 'x.freezed.dart';`.
      - name: Generate code (freezed / json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      # `lib/l10n/generated/` también está gitignoreado (mismo criterio).
      # `flutter pub get` ya lo dispara solo por `generate: true` en
      # pubspec.yaml, pero se deja explícito por las dudas — no vale la
      # pena depender de un side-effect implícito para algo que rompe el
      # build entero si falla.
      - name: Generate localizations (AppLocalizations)
        run: flutter gen-l10n

      # Falla el pipeline si algún archivo no está formateado con
      # `dart format` (--output=none no reescribe nada, solo reporta).
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      # Reglas estrictas de very_good_analysis (analysis_options.yaml):
      # cero advertencias o errores tolerados.
      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      # El código generado se saca del reporte: no es lógica propia, nadie lo
      # escribe y nadie debería escribirle tests, así que contarlo solo
      # distorsiona el porcentaje real de lo que sí mantenemos.
      #
      # Hasta acá se excluía únicamente `lib/l10n/generated/**`, dando por
      # sentado que los `*.g.dart` y `*.freezed.dart` quedaban afuera solos
      # "por ser `part of`". Con freezed pasa, pero con los `*.g.dart` no:
      # el generado por drift aparece en el informe con sus 2400 líneas, y
      # arrastró la cobertura del 86% al 44% sin que cambiara una sola línea
      # de lógica propia.
      - name: Strip generated code from coverage report
        run: |
          sudo apt-get update -y && sudo apt-get install -y lcov
          lcov --remove coverage/lcov.info \
            'lib/l10n/generated/*' '*.g.dart' '*.freezed.dart' \
            -o coverage/lcov.info --ignore-errors unused

      # Falla el pipeline si la cobertura de línea baja de 80%.
      - name: Enforce minimum coverage
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          path: coverage/lcov.info
          min_coverage: 80

  # Compilar es la única prueba real de que la configuración nativa (los
  # product flavors de Gradle, el applicationId de cada uno, los entry
  # points de Dart) está bien: `flutter analyze` y `flutter test` corren
  # sobre Dart y nunca tocan Gradle ni el AndroidManifest.
  #
  # El matrix recorre los tres flavors en paralelo y deriva el entry point
  # de su nombre, así que también verifica la convención que los une:
  # flavor `dev` <-> productFlavor "dev" <-> lib/main_dev.dart <->
  # AppFlavor.dev. Si alguien agrega un flavor de un lado y se olvida del
  # otro, este job lo encuentra.
  build-android:
    name: Build Android (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    # No tiene sentido gastar minutos compilando algo que ni siquiera pasa
    # el analizador.
    needs: analyze-and-test

    strategy:
      # Si un flavor falla, igual queremos saber si los otros dos también:
      # dice si el problema es de ese flavor o de la configuración común.
      fail-fast: false
      matrix:
        flavor: [dev, staging, prod]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # `android/app/build.gradle.kts` fija JVM_17 en compileOptions y en
      # kotlin.compilerOptions; el runner trae una versión más nueva por
      # defecto, así que se pide explícitamente la que el proyecto declara.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Mismo motivo que en el job de análisis: el código generado no se
      # versiona, así que sin estos dos pasos no hay nada que compilar.
      - name: Generate code (freezed / json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate localizations (AppLocalizations)
        run: flutter gen-l10n

      # Debug y no release: alcanza para probar que Gradle resuelve el
      # flavor y que la app enlaza, sin necesitar un keystore de firma.
      - name: Build APK
        run: >-
          flutter build apk --debug
          --flavor ${{ matrix.flavor }}
          --target lib/main_${{ matrix.flavor }}.dart

      # Deja el APK de dev descargable desde la pestaña de Actions, para
      # poder instalarlo en un teléfono sin tener que montar el entorno de
      # Flutter localmente.
      - name: Upload dev APK
        if: matrix.flavor == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: sinapsis-dev-debug-apk
          path: build/app/outputs/flutter-apk/app-dev-debug.apk
          if-no-files-found: error
          retention-days: 14
